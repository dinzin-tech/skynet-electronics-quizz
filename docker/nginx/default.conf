server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Internal location for pre-compressed static quiz bundles
    location /_bundles/ {
        internal;
        alias /var/www/html/storage/bundles/;
        sendfile on;
        tcp_nopush on;
        gzip_static on;
        add_header Cache-Control "private, no-transform, max-age=86400";
    }

    # Hot endpoints routed to hot.php (bypasses full framework)
    location ~ ^/api/(quiz|attempts|time) {
        try_files /hot.php =404;
        fastcgi_pass php:9000;
        fastcgi_index hot.php;
        fastcgi_param SCRIPT_FILENAME $document_root/hot.php;
        include fastcgi_params;
        fastcgi_read_timeout 5s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Employee SPA static files & HTML5 history fallback
    location /app/ {
        alias /var/www/html/public/app/;
        try_files $uri $uri/ /app/index.html;
    }

    location /quiz/ {
        try_files /app/index.html =404;
    }

    # Main application and admin routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Block direct execution of any other PHP scripts
    location ~ \.php$ {
        return 404;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Deny hidden files (.env, .git)
    location ~ /\. {
        deny all;
    }
}
