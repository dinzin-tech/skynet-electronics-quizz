[auth]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm-auth.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 512

; Static manager isolated for bcrypt password hashing
pm = static
pm.max_children = 3

request_terminate_timeout = 10s
pm.max_requests = 1000

php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 5
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.2-fpm-auth.log
