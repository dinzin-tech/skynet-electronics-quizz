[hot]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm-hot.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 1024

; Static process manager: zero fork overhead during high concurrency spikes
pm = static
pm.max_children = 10

; Strict timeout to prevent hanging connections (hot path max budget is 3ms)
request_terminate_timeout = 5s
pm.max_requests = 10000

; Memory limit tailored for hot path (zero-framework only needs 16M)
php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 3
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.2-fpm-hot.log
