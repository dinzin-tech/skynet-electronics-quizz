# ==============================================================================
# CorpQuiz Production Nginx Configuration - Hostinger KVM 2 (Ubuntu 22.04/24.04)
# Reverse Proxied behind Cloudflare with Full-Strict SSL
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $http_authorization zone=save_limit:10m rate=120r/m;

# Upstream PHP-FPM pools over high-performance Unix domain sockets
upstream php_hot {
    server unix:/run/php/php8.2-fpm-hot.sock;
    keepalive 32;
}

upstream php_auth {
    server unix:/run/php/php8.2-fpm-auth.sock;
    keepalive 8;
}

upstream php_main {
    server unix:/run/php/php8.2-fpm-main.sock;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name quiz.corp.local;

    # Cloudflare Real IP Restoration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    root /var/www/corpquiz/public;
    index index.php;

    client_max_body_size 10M;

    # Production Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 1. Health check endpoint
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }

    # 2. Pre-compressed static bundles via sendfile (immutable caching)
    location /_bundles/ {
        internal;
        alias /var/www/corpquiz/storage/bundles/;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        gzip_static on;
        add_header Cache-Control "private, no-transform, max-age=86400" always;
    }

    # 3. HOT PATH: Zero-framework, direct Redis Lua execution
    location ~ ^/api/(quiz|attempts|time) {
        try_files /hot.php =404;
        fastcgi_pass php_hot;
        fastcgi_index hot.php;
        fastcgi_param SCRIPT_FILENAME $document_root/hot.php;
        include fastcgi_params;
        fastcgi_read_timeout 3s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;

        # Keepalive fastcgi connection
        fastcgi_keep_conn on;
    }

    # 4. AUTH POOL: Rate-limited authentication
    location = /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        try_files /index.php =404;
        fastcgi_pass php_auth;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 5s;
    }

    # 5. React Employee SPA static assets & client routing
    location /app/ {
        alias /var/www/corpquiz/public/app/;
        try_files $uri $uri/ /app/index.html;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /quiz/ {
        try_files /app/index.html =404;
    }

    # 6. Admin and general API via Main pool
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_main;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # 7. Block direct execution of any other PHP scripts
    location ~ \.php$ {
        return 404;
    }

    # 8. Deny hidden files (.env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
