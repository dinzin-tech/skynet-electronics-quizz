# ==============================================================================
# CorpQuiz Prometheus Scrape Configuration
# Scrapes local application, exporters, and forwards alerts
# ==============================================================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

# Alertmanager configuration (Optional: connect to Slack/Email/PagerDuty)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['127.0.0.1:9093']

scrape_configs:
  # 1. CorpQuiz Application & Worker Metrics (Direct PHP-FPM /metrics endpoint)
  - job_name: "corpquiz_app"
    metrics_path: "/metrics"
    scheme: "http"
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:80"]
        labels:
          app: "corpquiz"
          env: "production"

  # 2. Host System Metrics (Node Exporter on 127.0.0.1:9100)
  - job_name: "node"
    scrape_interval: 10s
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: "hostinger-vps"

  # 3. Nginx Web Server Metrics (nginx-prometheus-exporter on 127.0.0.1:9113)
  - job_name: "nginx"
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:9113"]

  # 4. Redis Engine Metrics (redis_exporter on 127.0.0.1:9121)
  - job_name: "redis"
    scrape_interval: 5s
    static_configs:
      - targets: ["127.0.0.1:9121"]

# Optional: Remote Write directly to Grafana Cloud / VictoriaMetrics to save local disk/CPU:
# remote_write:
#   - url: "<YOUR_GRAFANA_CLOUD_PROMETHEUS_ENDPOINT>"
#     basic_auth:
#       username: "<INSTANCE_ID>"
#       password: "<API_KEY>"
