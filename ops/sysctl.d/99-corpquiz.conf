# ==============================================================================
# CorpQuiz Linux Kernel Tuning - 2 vCPU VPS High Concurrency (2,000-3,000 Users)
# ==============================================================================
# Max socket backlog for incoming SYN packets and listening queues
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Memory overcommit policy for Redis background saving (BGSAVE / AOF rewrite)
vm.overcommit_memory = 1

# File descriptors limit
fs.file-max = 2097152

# TCP socket reuse and fin timeout
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.ip_local_port_range = 1024 65535
