# ==============================================================================
# CorpQuiz Production Redis Configuration (2 vCPU Hostinger VPS)
# ==============================================================================

# Network & Socket configuration
# Listen on localhost and provide high-performance Unix Domain Socket
bind 127.0.0.1 -::1
port 6379
unixsocket /var/run/redis/redis.sock
unixsocketperm 770

# Systemd integration & working directory (CRITICAL for Ubuntu systemd Type=notify)
supervised systemd
daemonize no
pidfile /run/redis/redis-server.pid
dir /var/lib/redis

# Memory limits & durability
maxmemory 1gb
maxmemory-policy noeviction

# AOF persistence for zero-answer-loss guarantee
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots as secondary backup
save 900 1
save 300 10
save 60 1000

# Client & Performance tuning
timeout 0
tcp-keepalive 300
tcp-backlog 2048
databases 16
loglevel notice
logfile /var/log/redis/redis-server.log
