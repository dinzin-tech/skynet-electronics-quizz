# ==============================================================================
# CorpQuiz Production Redis Configuration (2 vCPU Hostinger VPS)
# ==============================================================================

# High-performance Unix Domain Socket communication
port 0
unixsocket /run/redis/redis-server.sock
unixsocketperm 770

# Memory limits & durability
maxmemory 1gb
maxmemory-policy noeviction

# AOF persistence for zero-answer-loss guarantee
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots as secondary backup
save 900 1
save 300 10
save 60 1000

# Client & Performance tuning
timeout 0
tcp-keepalive 300
tcp-backlog 2048
databases 16
loglevel notice
logfile /var/log/redis/redis-server.log
