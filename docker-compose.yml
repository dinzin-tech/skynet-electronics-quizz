services:
  nginx:
    image: nginx:alpine
    container_name: quizz_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - redis_socket:/var/run/redis
    depends_on:
      - php
    networks:
      - quizz_net
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: quizz_php
    volumes:
      - .:/var/www/html
      - redis_socket:/var/run/redis
    environment:
      - APP_ENV=local
      - DEBUG_MODE=true
      - REDIS_SOCKET=/var/run/redis/redis.sock
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEFAULT_DB_HOST=mysql
      - DEFAULT_DB_DATABASE=corp_quizz
      - DEFAULT_DB_USER=quizz_user
      - DEFAULT_DB_PASSWORD=quizz_password
    depends_on:
      - mysql
      - redis
    networks:
      - quizz_net
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: quizz_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: corp_quizz
      MYSQL_USER: quizz_user
      MYSQL_PASSWORD: quizz_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - quizz_net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: quizz_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - redis_socket:/var/run/redis
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - quizz_net
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  redis_socket:

networks:
  quizz_net:
    driver: bridge
