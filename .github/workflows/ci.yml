name: CI (Test & Lint)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint PHP (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs --standard=phpcs.xml

  build-frontend:
    name: Build Employee SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: spa/package.json

      - name: Install SPA dependencies
        run: |
          cd spa
          npm install

      - name: Type-check and Build Vite Bundle
        run: |
          cd spa
          npm run build

  test-backend:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: corp_quizz
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: redis, pdo_mysql, apcu, mbstring, curl, xml, zip, opcache
          ini-values: apc.enable_cli=1, opcache.enable_cli=1
          tools: composer:v2

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          sed -i 's/DEFAULT_DB_HOST=.*/DEFAULT_DB_HOST=127.0.0.1/' .env
          sed -i 's/DEFAULT_DB_DATABASE=.*/DEFAULT_DB_DATABASE=corp_quizz/' .env
          sed -i 's/DEFAULT_DB_USER=.*/DEFAULT_DB_USER=root/' .env
          sed -i 's/DEFAULT_DB_PASSWORD=.*/DEFAULT_DB_PASSWORD=secret/' .env
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/REDIS_PORT=.*/REDIS_PORT=6379/' .env

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate Application Key
        run: php bin/console keygenerate || echo "Key generated"

      - name: Run Database Migrations
        run: php bin/console migrations run

      - name: Execute PHPUnit Suite
        run: vendor/bin/phpunit
